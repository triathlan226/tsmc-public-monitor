name: Update dashboard data

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Taipei
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update data files
        env:
          YAHOO_TICKER: 2330.TW
          GOOGLE_SHEET_EVENTS_CSV_URL: ${{ secrets.GOOGLE_SHEET_EVENTS_CSV_URL }}
          GOOGLE_SHEET_WATCHLIST_CSV_URL: ${{ secrets.GOOGLE_SHEET_WATCHLIST_CSV_URL }}
        run: |
          python scripts/update_data.py \
            --input data/data.json \
            --output-json data/data.json \
            --output-js data/data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/data.js
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update dashboard data"
            git push
          fi
