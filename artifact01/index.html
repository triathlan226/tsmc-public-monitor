<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股市值前 20 · JSON 資料儀表板</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #101827;
      --panel: #172033;
      --panel-2: #202b40;
      --line: #34445f;
      --text: #e8edf6;
      --muted: #9ca9bd;
      --accent: #54c6eb;
      --green: #4ade80;
      --red: #fb7185;
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: 0;
    }
    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat, .card, .modal, .notice {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .stat {
      padding: 12px 14px;
    }
    .stat b {
      display: block;
      font-size: 22px;
    }
    .stat span {
      color: var(--muted);
      font-size: 12px;
    }
    .notice {
      padding: 12px 14px;
      margin-bottom: 22px;
      color: #d7f7ff;
      font-size: 13px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button, input {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      min-height: 38px;
    }
    button {
      padding: 0 13px;
      cursor: pointer;
    }
    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #07111d;
      font-weight: 700;
    }
    input {
      width: min(100%, 260px);
      padding: 0 12px;
    }
    .group-title {
      margin: 28px 0 12px;
      padding-left: 10px;
      border-left: 4px solid var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .card {
      min-height: 190px;
      padding: 15px;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card h2 {
      margin: 0;
      font-size: 18px;
    }
    .ticker {
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }
    .role {
      min-height: 48px;
      margin: 8px 0 12px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 5px;
      font-size: 13px;
    }
    .row span:first-child {
      color: var(--muted);
    }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #334155;
      color: var(--text);
      font-size: 12px;
    }
    .badge.warn { background: #6f3e10; color: #ffe3a6; }
    .badge.dream { background: #751a2a; color: #ffd6dc; }
    .badge.ok { background: #12462d; color: #bbf7d0; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-start;
      justify-content: center;
      overflow: auto;
      padding: 28px 16px;
      background: rgba(4, 9, 17, .78);
    }
    .modal {
      width: min(940px, 100%);
      padding: 22px;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }
    .modal h2 {
      margin: 0;
      font-size: 24px;
    }
    .close {
      width: 38px;
      height: 38px;
      padding: 0;
      font-size: 24px;
      line-height: 1;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin: 18px 0;
    }
    .kpi {
      background: var(--panel-2);
      border-radius: 8px;
      padding: 11px 12px;
    }
    .kpi b {
      display: block;
      font-size: 18px;
    }
    .kpi span {
      color: var(--muted);
      font-size: 12px;
    }
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .chartbox, .note {
      background: var(--panel-2);
      border-radius: 8px;
      padding: 14px;
    }
    .chartbox h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .note {
      margin-top: 14px;
      font-size: 14px;
    }
    .sources {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-word;
    }
    .error {
      color: #fecdd3;
      background: #7f1d1d;
      padding: 14px;
      border-radius: 8px;
    }
    canvas { max-height: 250px; }
    @media (max-width: 760px) {
      main { width: min(100% - 24px, 1180px); padding-top: 18px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { align-items: stretch; }
      input { width: 100%; }
      .charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>台股市值前 20 · AI 概念股分析儀表板</h1>
    <p class="sub">此頁由同資料夾內的 JSON 檔即時載入，適合直接放在 GitHub Pages 的 artifact01 資料夾中瀏覽。</p>

    <section class="summary" aria-label="資料摘要">
      <div class="stat"><b id="totalCount">--</b><span>公司數</span></div>
      <div class="stat"><b id="aiCount">--</b><span>AI 相關</span></div>
      <div class="stat"><b id="avgPe">--</b><span>平均本益比</span></div>
      <div class="stat"><b id="asOf">--</b><span>資料日期</span></div>
    </section>

    <div class="notice">資料來源與品質說明保留在各公司 JSON 檔中。本頁僅做資料展示與流程示範，不構成投資建議。</div>

    <div class="toolbar">
      <div class="filters" id="filters">
        <button class="active" data-filter="all" type="button">全部</button>
        <button data-filter="ai" type="button">AI 相關</button>
        <button data-filter="dream" type="button">高本夢比</button>
        <button data-filter="income" type="button">殖利率</button>
      </div>
      <input id="search" type="search" placeholder="搜尋公司、代號、產業">
    </div>

    <div id="content"></div>
  </main>

  <div class="overlay" id="overlay">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle"></h2>
          <div class="sub" id="modalSub"></div>
        </div>
        <button class="close" type="button" onclick="closeModal()" aria-label="關閉">×</button>
      </div>
      <div id="modalBody"></div>
    </section>
  </div>

  <script>
    const JSON_FILES = [
      "1216_統一.json",
      "1301_台塑.json",
      "2207_和泰車.json",
      "2303_聯電.json",
      "2308_台達電.json",
      "2317_鴻海.json",
      "2330_台積電.json",
      "2345_智邦.json",
      "2382_廣達.json",
      "2412_中華電.json",
      "2454_聯發科.json",
      "2881_富邦金.json",
      "2882_國泰金.json",
      "2884_玉山金.json",
      "2886_兆豐金.json",
      "2891_中信金.json",
      "3008_大立光.json",
      "3231_緯創.json",
      "3711_日月光投控.json",
      "6669_緯穎.json"
    ];

    let stocks = [];
    let currentFilter = "all";
    let charts = [];

    const twd = new Intl.NumberFormat("zh-TW");
    const content = document.getElementById("content");
    const search = document.getElementById("search");
    const overlay = document.getElementById("overlay");

    function value(v, suffix = "") {
      return v === null || v === undefined || v === "" ? "N/A" : `${v}${suffix}`;
    }

    function pct(v) {
      if (v === null || v === undefined) return "N/A";
      const cls = v > 0 ? "up" : v < 0 ? "down" : "";
      const sign = v > 0 ? "+" : "";
      return `<span class="${cls}">${sign}${Number(v).toFixed(2)}%</span>`;
    }

    function normalize(data, file) {
      const pe = data.valuation?.pe ?? null;
      const yieldPct = data.valuation?.dividend_yield_pct ?? null;
      const dream = Boolean(data.assessment?.is_dream_pe) || (pe !== null && pe >= 45);

      return {
        ...data,
        file,
        close: data.price?.close ?? null,
        closeDate: data.price?.close_date ?? data.as_of_date ?? null,
        c1w: data.price?.change_1w_pct ?? null,
        c2w: data.price?.change_2w_pct ?? null,
        c4w: data.price?.change_4w_pct ?? null,
        hist: data.price?.history_6m_monthclose ?? null,
        pe,
        pb: data.valuation?.pb ?? null,
        yieldPct,
        epsTTM: data.earnings?.eps_ttm ?? null,
        eps2025: data.earnings?.eps_2025 ?? null,
        eps2026e: data.earnings?.eps_2026e ?? null,
        ai: /AI|人工智慧|晶片|半導體|封裝|伺服器|CoWoS|ASIC|GPU/i.test(`${data.ai_role || ""} ${data.sector || ""}`),
        dream,
        badgeClass: dream ? "dream" : pe && pe >= 28 ? "warn" : "ok"
      };
    }

    async function loadData() {
      try {
        const loaded = await Promise.all(JSON_FILES.map(async file => {
          const res = await fetch(encodeURI(file), { cache: "no-store" });
          if (!res.ok) throw new Error(`${file} 載入失敗：${res.status}`);
          return normalize(await res.json(), file);
        }));
        stocks = loaded.sort((a, b) => Number(a.ticker) - Number(b.ticker));
        updateSummary();
        render();
      } catch (error) {
        content.innerHTML = `<div class="error">${error.message}<br>請確認 index.html 與所有 JSON 檔都在 artifact01 同一個資料夾。</div>`;
      }
    }

    function updateSummary() {
      const peList = stocks.map(s => s.pe).filter(v => typeof v === "number");
      const dates = stocks.map(s => s.as_of_date).filter(Boolean).sort();
      document.getElementById("totalCount").textContent = stocks.length;
      document.getElementById("aiCount").textContent = stocks.filter(s => s.ai).length;
      document.getElementById("avgPe").textContent = peList.length ? `${(peList.reduce((a, b) => a + b, 0) / peList.length).toFixed(1)}x` : "N/A";
      document.getElementById("asOf").textContent = dates.at(-1) || "N/A";
    }

    function matchesFilter(stock) {
      if (currentFilter === "ai") return stock.ai;
      if (currentFilter === "dream") return stock.dream;
      if (currentFilter === "income") return (stock.yieldPct ?? 0) >= 3;
      return true;
    }

    function render() {
      const term = search.value.trim().toLowerCase();
      const visible = stocks.filter(stock => {
        const haystack = `${stock.name} ${stock.name_en || ""} ${stock.ticker} ${stock.sector}`.toLowerCase();
        return matchesFilter(stock) && haystack.includes(term);
      });

      if (!visible.length) {
        content.innerHTML = `<div class="notice">沒有符合條件的資料。</div>`;
        return;
      }

      const groups = visible.reduce((acc, stock) => {
        const key = stock.sector || "未分類";
        (acc[key] ||= []).push(stock);
        return acc;
      }, {});

      content.innerHTML = Object.entries(groups).map(([sector, list]) => `
        <section>
          <div class="group-title">${sector}</div>
          <div class="cards">
            ${list.map(stock => cardHtml(stock)).join("")}
          </div>
        </section>
      `).join("");

      content.querySelectorAll("[data-ticker]").forEach(card => {
        card.addEventListener("click", () => openModal(card.dataset.ticker));
      });
    }

    function cardHtml(stock) {
      return `
        <article class="card" data-ticker="${stock.ticker}" tabindex="0">
          <h2>${stock.name} <span class="ticker">${stock.ticker}</span></h2>
          <div class="role">${stock.ai_role || stock.business || ""}</div>
          <div class="row"><span>收盤價</span><strong>${value(stock.close)}</strong></div>
          <div class="row"><span>4 週漲跌</span><strong>${pct(stock.c4w)}</strong></div>
          <div class="row"><span>本益比 / 殖利率</span><strong>${value(stock.pe, "x")} / ${value(stock.yieldPct, "%")}</strong></div>
          <span class="badge ${stock.badgeClass}">${stock.assessment?.valuation_signal || "估值觀察"}</span>
        </article>
      `;
    }

    function openModal(ticker) {
      const stock = stocks.find(item => item.ticker === ticker);
      if (!stock) return;

      charts.forEach(chart => chart.destroy());
      charts = [];

      document.getElementById("modalTitle").textContent = `${stock.name} ${stock.ticker}`;
      document.getElementById("modalSub").textContent = `${stock.sector || "未分類"} · ${stock.market || ""} · JSON：${stock.file}`;
      document.getElementById("modalBody").innerHTML = `
        <div class="kpis">
          <div class="kpi"><b>${value(stock.close)}</b><span>收盤價 ${stock.currency || ""}</span></div>
          <div class="kpi"><b>${pct(stock.c1w)}</b><span>1 週</span></div>
          <div class="kpi"><b>${pct(stock.c4w)}</b><span>4 週</span></div>
          <div class="kpi"><b>${value(stock.pe, "x")}</b><span>本益比</span></div>
          <div class="kpi"><b>${value(stock.pb, "x")}</b><span>股價淨值比</span></div>
          <div class="kpi"><b>${value(stock.yieldPct, "%")}</b><span>殖利率</span></div>
        </div>
        <div class="charts">
          ${stock.hist ? '<div class="chartbox"><h3>近月收盤價</h3><canvas id="histChart"></canvas></div>' : ""}
          <div class="chartbox"><h3>漲跌幅比較</h3><canvas id="changeChart"></canvas></div>
          <div class="chartbox"><h3>估值指標</h3><canvas id="valueChart"></canvas></div>
          <div class="chartbox"><h3>EPS</h3><canvas id="epsChart"></canvas></div>
        </div>
        <div class="note">
          <strong>公司定位：</strong>${stock.business || "N/A"}<br><br>
          <strong>AI 角色：</strong>${stock.ai_role || "N/A"}<br><br>
          <strong>評估：</strong>${stock.assessment?.notes || "N/A"}<br><br>
          <strong>資料品質：</strong>${stock.data_quality_note || "N/A"}
          <div class="sources">來源：${(stock.sources || []).map(src => `<a href="${src}" target="_blank" rel="noopener">${src}</a>`).join(" · ") || "N/A"}</div>
        </div>
      `;

      overlay.style.display = "flex";
      drawCharts(stock);
    }

    function drawCharts(stock) {
      const grid = {
        grid: { color: "#34445f66" },
        ticks: { color: "#9ca9bd", font: { size: 10 } }
      };

      if (stock.hist) {
        const labels = Object.keys(stock.hist);
        charts.push(new Chart(document.getElementById("histChart"), {
          type: "line",
          data: {
            labels,
            datasets: [{ data: labels.map(label => stock.hist[label]), borderColor: "#54c6eb", backgroundColor: "#54c6eb33", fill: true, tension: .3 }]
          },
          options: { plugins: { legend: { display: false } }, scales: { x: grid, y: grid } }
        }));
      }

      charts.push(new Chart(document.getElementById("changeChart"), {
        type: "bar",
        data: {
          labels: ["1週", "2週", "4週"],
          datasets: [{ data: [stock.c1w, stock.c2w, stock.c4w], backgroundColor: ["#54c6eb", "#fbbf24", stock.c4w >= 0 ? "#4ade80" : "#fb7185"] }]
        },
        options: { plugins: { legend: { display: false } }, scales: { x: grid, y: grid } }
      }));

      charts.push(new Chart(document.getElementById("valueChart"), {
        type: "bar",
        data: {
          labels: ["本益比", "股價淨值比", "殖利率"],
          datasets: [{ data: [stock.pe, stock.pb, stock.yieldPct], backgroundColor: ["#54c6eb", "#a78bfa", "#4ade80"] }]
        },
        options: { plugins: { legend: { display: false } }, scales: { x: grid, y: grid } }
      }));

      charts.push(new Chart(document.getElementById("epsChart"), {
        type: "bar",
        data: {
          labels: ["TTM", "2025", "2026E"],
          datasets: [{ data: [stock.epsTTM, stock.eps2025, stock.eps2026e], backgroundColor: ["#94a3b8", "#54c6eb", "#4ade80"] }]
        },
        options: { plugins: { legend: { display: false } }, scales: { x: grid, y: grid } }
      }));
    }

    function closeModal() {
      overlay.style.display = "none";
      charts.forEach(chart => chart.destroy());
      charts = [];
    }

    document.getElementById("filters").addEventListener("click", event => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      currentFilter = button.dataset.filter;
      document.querySelectorAll("#filters button").forEach(item => item.classList.toggle("active", item === button));
      render();
    });

    search.addEventListener("input", render);
    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    loadData();
  </script>
</body>
</html>
