  .chartbox h4{font-size:13px;margin-bottom:8px;color:var(--muted);}
  .note{background:var(--card2);border-radius:10px;padding:14px;font-size:13px;margin-top:14px;}

    c.innerHTML=`<div class="nm">${d.name} <span class="tk">${d.ticker}</span></div>
      <div class="role">${d.role}</div>
      <div class="row"><span style="color:var(--muted)">收盤</span><span>${d.close} 元</span></div>
      <div class="row"><span style="color:var(--muted)">近1週/4週</span><span>${pct(d.c1w)} / ${pct(d.c4w)}</span></div>
      <div class="row"><span style="color:var(--muted)">本益比</span><span>${d.pe?d.pe+"x":"—(虧損)"}</span></div>
      <span class="badge ${d.badge}">${d.signal}</span>`;
    wrap.appendChild(c);
  });
  gc.appendChild(wrap);
});

let charts=[];
const grid={grid:{color:"#33415544"},ticks:{color:"#94a3b8",font:{size:10}}};
function openModal(i){
  const d=DATA[i];
  const eps=d.eps2026e??d.epsTTM;
  document.getElementById("modalContent").innerHTML=`
    <h2>${d.name} <span style="color:var(--muted);font-size:16px">${d.ticker}</span></h2>
    <div style="color:var(--muted);font-size:13px;margin-top:4px">${d.group} · ${d.ai?"AI概念":"非AI"}</div>
    <div class="kpis">
      <div class="kpi"><div class="v">${d.close}</div><div class="l">收盤(元)</div></div>
      <div class="kpi"><div class="v">${pct(d.c4w)}</div><div class="l">近4週</div></div>
      <div class="kpi"><div class="v">${d.pe?d.pe+"x":"—"}</div><div class="l">本益比</div></div>
      <div class="kpi"><div class="v">${eps??"—"}</div><div class="l">EPS(元)</div></div>
      <div class="kpi"><div class="v">${d.pb?d.pb:"—"}</div><div class="l">股價淨值比</div></div>
      <div class="kpi"><div class="v">${d.yield?d.yield+"%":"—"}</div><div class="l">殖利率</div></div>
    </div>
    <div class="charts">
      ${d.hist?'<div class="chartbox"><h4>半年走勢（月收盤·官方）</h4><canvas id="histC"></canvas></div>':''}
      <div class="chartbox"><h4>近一個月日線（5月·官方）</h4><canvas id="mayC"></canvas></div>
      ${d.eps2025!=null?'<div class="chartbox"><h4>EPS 趨勢（元）</h4><canvas id="epsC"></canvas></div>':''}
      ${d.pe?'<div class="chartbox"><h4>本益比 vs AI同業均值(約35x)</h4><canvas id="peC"></canvas></div>':''}
    </div>
    <div class="note"><b>判讀：</b>${d.note}<br><br>
      <b>本夢比檢查：</b>${d.dream?'⚠️ 本益比/PB偏高且漲幅超過獲利成長 → 本夢比成分高，追高風險大':(d.pe?'✅ 本益比與基本面相對匹配 → 非純本夢比':'⚠️ 本益比無法計算（獲利為負），屬景氣循環/虧損階段，需觀察獲利轉正')}</div>`;
  document.getElementById("overlay").style.display="flex";
  charts.forEach(c=>c.destroy());charts=[];
  if(d.hist){const hk=Object.keys(d.hist);
    charts.push(new Chart(histC,{type:"line",data:{labels:hk,datasets:[{data:hk.map(k=>d.hist[k]),borderColor:"#38bdf8",backgroundColor:"#38bdf833",fill:true,tension:.3}]},options:{plugins:{legend:{display:false}},scales:{x:grid,y:grid}}}));}
  charts.push(new Chart(mayC,{type:"line",data:{labels:d.may.map((_,j)=>j+1),datasets:[{data:d.may,borderColor:d.c4w>0?"#34d399":"#f87171",fill:false,tension:.2,pointRadius:0}]},options:{plugins:{legend:{display:false}},scales:{x:grid,y:grid}}}));
  if(d.eps2025!=null){
    const e=[["2025",d.eps2025],["2026E",d.eps2026e],["2026Q1",d.epsQ1]].filter(x=>x[1]!=null);
    charts.push(new Chart(epsC,{type:"bar",data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>x[1]),backgroundColor:"#38bdf8"}]},options:{plugins:{legend:{display:false}},scales:{x:grid,y:grid}}}));
  }
  if(d.pe){
    charts.push(new Chart(peC,{type:"bar",data:{labels:[d.name,"AI同業均值"],datasets:[{data:[d.pe,35],backgroundColor:[d.dream?"#f87171":"#34d399","#475569"]}]},options:{plugins:{legend:{display:false}},scales:{x:grid,y:grid}}}));
  }
}
function closeModal(){document.getElementById("overlay").style.display="none";}
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")closeModal();};
</script>
</body>
</html>
